<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberPass Excel Importer</title><link rel="stylesheet" href="dist/popup.css"></head><body><main><header><div class="eyebrow">CYBERPASS</div><h1>Excel Importer</h1><p class="sub">Review workbook values before they reach the assessment page.</p></header><section id="dropZone" class="drop-zone" tabindex="0"><input id="fileInput" type="file" accept=".xlsx,.xlsm,.xls,.xlsb,.csv,.tsv"><div id="dropPrompt" class="drop-copy"><div class="drop-icon">↥</div><strong>Drop a VQ workbook here</strong><span>or choose a local file</span></div><div id="selectedFile" class="selected-file hidden"><span class="selected-icon">✓</span><span id="selectedFileName"></span><button id="clearFile" type="button">Clear</button></div></section><section id="workbookCard" class="card hidden"><div class="row"><div><span class="label">Workbook</span><strong id="fileName"></strong></div><div class="count" id="excelCount">—</div></div></section><section class="actions"><button id="fillBtn" class="primary" disabled>Fill all</button></section><label class="check"><input id="replaceExisting" type="checkbox"> Replace existing values</label><label class="switch-row"><span><strong>Override requirement colour</strong><small>Make requirement descriptions black</small></span><input id="overrideColour" type="checkbox" role="switch"><span class="switch-ui" aria-hidden="true"></span></label><div id="status" class="status" role="status"></div></main><script type="module" src="dist/popup.js"></script></body></html>
